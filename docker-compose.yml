services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-DragoonT}
      ACCOUNT_CREDENTIAL_FILE: /data/account.dragoont
      CORS_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:3000}
    volumes:
      - ./:/host-project
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
