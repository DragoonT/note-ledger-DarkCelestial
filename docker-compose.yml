services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pocket_ledger}
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - postgres_data:/var/lib/postgresql
    ports:
      # Host 5433 avoids clashing with a local Windows/macOS PostgreSQL on 5432.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pocket_ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-DragoonT}
      ACCOUNT_CREDENTIAL_FILE: /data/account.dragoont
      CORS_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:3000}
    volumes:
      - ./:/host-project
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
